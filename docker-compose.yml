# Local services for gh-issue: Qdrant always, the Inngest dev server for local
# runs. Qdrant is pinned to the same minor as the client in pyproject.toml.
services:
  inngest:
    image: inngest/inngest:v1.45.1
    container_name: gh-issue-inngest
    # No discovery: the worker connects out to the dev server, not the other way.
    command: inngest dev --no-discovery
    ports:
      - "8288:8288"   # API, and the dashboard at http://localhost:8288
      - "8289:8289"   # connect gateway, where `gh-issue worker` connects
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: gh-issue-qdrant
    ports:
      - "6333:6333"   # REST, and the dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-storage:
