# Qdrant for gh-issue. Pinned to the same minor as the client in pyproject.toml.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: gh-issue-qdrant
    ports:
      - "6333:6333"   # REST, and the dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-storage:
